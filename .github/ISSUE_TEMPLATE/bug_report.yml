name: バグ・不具合の報告 / Bug report
description: 動作不良や予期しない挙動を報告します / Report a bug or unexpected behavior
title: "[Bug]: "
body:
  - type: dropdown
    id: severity
    attributes:
      label: 重要度 / Severity
      description: 影響範囲と回避策の有無を目安に選択してください。 / Choose based on impact and available workarounds.
      options:
        - notice - 軽微な表示・文書上の問題 / Minor visual or documentation issue
        - caution - 影響が限定的で、回避策がある / Limited impact with a workaround
        - warning - 主要な機能に影響する / A major feature is affected
        - danger - 広範な機能停止やデータ破損のおそれがある / Broad outage or possible data corruption
        - critical - サービス停止、重大なデータ損失など緊急対応が必要 / Service outage or serious data loss requiring urgent response
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 問題の説明 / Description
      description: 何が起きたか、期待する動作を記載してください。 / Describe what happened and what you expected.
      placeholder: 再現できる範囲で具体的に記載してください。 / Please provide as much detail as possible.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順 / Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 実行環境 / Environment
      description: OS、Go のバージョン、実行コマンドなど / OS, Go version, commands, and other relevant details.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 備考 / Additional notes
      description: 関連リンク、ログ、補足情報などがあれば記載してください。 / Add links, logs, or any other relevant information.
    validations:
      required: false
