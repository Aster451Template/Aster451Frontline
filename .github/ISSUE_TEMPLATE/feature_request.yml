name: 改善案・機能要望
description: 既存機能の改善や新機能を提案します
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どのような不便や課題を解決したいか説明してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 期待する動作や改善案を説明してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
    validations:
      required: false
